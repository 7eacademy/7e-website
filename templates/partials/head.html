<script>/* 防止查看原始碼：停用右鍵選單與開發者工具快捷鍵 */(function(){document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
if(e.key==='F12'||(c&&k==='u')||(c&&k==='s')||(c&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(e.metaKey&&e.altKey&&(k==='i'||k==='j'||k==='c'||k==='u'))){e.preventDefault();e.stopPropagation();return false;}},true);
document.addEventListener('dragstart',function(e){if(e.target&&e.target.tagName==='IMG')e.preventDefault()});})();</script>
<script>/* 每一頁都從頁首開始 */(function(){try{history.scrollRestoration='manual'}catch(e){}var h=location.hash;if(h){window.__startHash=h;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function top(){var d=document.documentElement;d.style.scrollBehavior='auto';window.scrollTo(0,0);d.scrollTop=0;if(document.body)document.body.scrollTop=0;}
var touched=false;['wheel','touchstart','pointerdown','keydown','click'].forEach(function(t){window.addEventListener(t,function(){touched=true},{passive:true,once:true})});
function guard(){if(!touched)top();}
top();document.addEventListener('DOMContentLoaded',guard);window.addEventListener('load',function(){guard();setTimeout(guard,60);setTimeout(guard,250);});
window.addEventListener('pageshow',function(){touched=false;guard();setTimeout(guard,60);});})();</script>

<script>window.SITE={endpoint:"{{settings.form_endpoint}}"};</script>
