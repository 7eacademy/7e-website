<article class="card recap">
 <div class="meta"><span>{{date_dot}}</span>{{#place}}<span>{{place}}</span>{{/place}}{{#teacher}}<span>講師：{{teacher}}</span>{{/teacher}}</div>
 <h3>{{title}}</h3>
 <div class="prose">{{{html}}}</div>
 <div class="thumbs c4">{{#photos}}<a href="{{big}}" data-lb="recap-{{date}}-{{title}}"><img src="{{thumb}}" alt="{{title}}" loading="lazy" decoding="async"></a>{{/photos}}</div>
</article>
